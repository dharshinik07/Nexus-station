version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexussecurepass}
      POSTGRES_DB: ${POSTGRES_DB:-nexusstation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusadmin -d nexusstation"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net

  # 2. Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexusadmin}:${POSTGRES_PASSWORD:-nexussecurepass}@db:5432/${POSTGRES_DB:-nexusstation}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-secret-access-token-min-32-chars-long-xyz-12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-secret-refresh-token-min-32-chars-long-xyz-12345}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: "false"
      STORAGE_DIR: "/app/uploads"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - nexus_net

  # 3. React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - nexus_net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  nexus_net:
    driver: bridge
